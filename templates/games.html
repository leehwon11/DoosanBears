{% extends "base.html" %}
{% block title %}전체 경기 · 두산 베어스{% endblock %}

{% block head %}
<style>
  .page-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem; }
  .page-title { font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:2px; }
  .league-tab-wrap { display:flex;gap:8px;margin-bottom:1.5rem;align-items:center;flex-wrap:wrap; }
  .league-tab { padding:7px 20px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--gray);cursor:pointer;font-family:inherit;font-size:0.85rem;font-weight:500;transition:all 0.2s; }
  .league-tab.active { background:var(--blue);border-color:var(--blue);color:white; }
  .league-tab:hover:not(.active) { border-color:rgba(255,255,255,0.3);color:var(--white); }
  .league-content { display:none; }
  .league-content.active { display:block; }
  .season-select { background:var(--navy);color:var(--white);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-family:inherit;font-size:0.85rem;cursor:pointer;margin-left:auto; }
  .month-nav { display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem; }
  .month-nav button { background:var(--card);border:1px solid var(--border);color:var(--white);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;transition:background 0.2s;display:flex;align-items:center;justify-content:center; }
  .month-nav button:hover { background:var(--blue); }
  .month-label { font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px;min-width:120px;text-align:center; }
  .calendar { background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:2rem; }
  .cal-header { display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border); }
  .cal-header span { text-align:center;padding:10px;font-size:0.78rem;color:var(--gray);font-weight:500; }
  .cal-header span:first-child { color:#ff6b6b; }
  .cal-header span:last-child  { color:#74b9ff; }
  .cal-body { display:grid;grid-template-columns:repeat(7,1fr); }
  .cal-cell { min-height:80px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px;position:relative; }
  .cal-cell:nth-child(7n) { border-right:none; }
  .cal-cell.empty { background:rgba(0,0,0,0.1); }
  .cal-cell.today { background:rgba(27,58,107,0.3); }
  .cal-day { font-size:0.78rem;color:var(--gray);margin-bottom:4px; }
  .cal-cell.sunday .cal-day   { color:#ff6b6b; }
  .cal-cell.saturday .cal-day { color:#74b9ff; }
  .cal-game { display:block;border-radius:6px;padding:4px 6px;text-decoration:none;margin-top:2px;transition:opacity 0.15s; }
  .cal-game:hover { opacity:0.8; }
  .cal-game.win  { background:rgba(39,174,96,0.25);border:1px solid rgba(39,174,96,0.4); }
  .cal-game.lose { background:rgba(200,16,46,0.2);border:1px solid rgba(200,16,46,0.3); }
  .cal-game.draw { background:rgba(138,149,163,0.2);border:1px solid rgba(138,149,163,0.3); }
  .cal-game-score { font-family:'Bebas Neue',sans-serif;font-size:0.95rem;letter-spacing:1px;color:var(--white); }
  .cal-game-team { font-size:0.7rem;color:rgba(248,249,250,0.6);margin-top:1px; }
  .season-summary { display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:2rem; }
  @media(max-width:600px){.season-summary{grid-template-columns:repeat(2,1fr);}}
  .sum-box { background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1rem;text-align:center; }
  .sum-num { font-family:'Bebas Neue',sans-serif;font-size:2.2rem;line-height:1;margin-bottom:4px; }
  .sum-label { font-size:0.75rem;color:var(--gray);letter-spacing:1px; }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-title">전체 경기</div>
  <a href="/" style="color:var(--gray);text-decoration:none;font-size:0.85rem;">← 홈으로</a>
</div>

<div class="league-tab-wrap">
  <button class="league-tab active" onclick="switchLeague('kbo',this)">KBO</button>
  <button class="league-tab" onclick="switchLeague('futures',this)">퓨처스</button>
  <select class="season-select" id="kbo-year-sel" onchange="changeSeason('kbo',this.value)" style="display:block;">
    {% for yr in years %}<option value="{{ yr }}" {% if yr == current_year %}selected{% endif %}>{{ yr }}시즌</option>{% endfor %}
  </select>
  <select class="season-select" id="futures-year-sel" onchange="changeSeason('futures',this.value)" style="display:none;">
    {% for yr in fut_years %}<option value="{{ yr }}" {% if yr == current_year %}selected{% endif %}>{{ yr }}시즌</option>{% endfor %}
  </select>
</div>

<!-- KBO -->
<div id="tab-kbo" class="league-content active">
  <div class="season-summary" id="kbo-summary"></div>
  <div class="month-nav">
    <button onclick="changeMonth('kbo',-1)">‹</button>
    <div class="month-label" id="kbo-month-label"></div>
    <button onclick="changeMonth('kbo',1)">›</button>
  </div>
  <div class="calendar">
    <div class="cal-header"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="cal-body" id="kbo-cal-body"></div>
  </div>
</div>

<!-- 퓨처스 -->
<div id="tab-futures" class="league-content">
  <div class="season-summary" id="futures-summary"></div>
  <div class="month-nav">
    <button onclick="changeMonth('futures',-1)">‹</button>
    <div class="month-label" id="futures-month-label"></div>
    <button onclick="changeMonth('futures',1)">›</button>
  </div>
  <div class="calendar">
    <div class="cal-header"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="cal-body" id="futures-cal-body"></div>
  </div>
</div>

<script>
const allGames = {{ games | tojson }};
const allFutures = {{ futures_games | tojson }};
const today = new Date();
const CURRENT_YEAR = "{{ current_year }}";

const state = {
  kbo:     { year: CURRENT_YEAR, month: today.getMonth(), calYear: today.getFullYear() },
  futures: { year: CURRENT_YEAR, month: today.getMonth(), calYear: today.getFullYear() },
};

function getGameMap(allData, year) {
  const map = {};
  allData.filter(g => g.date && g.date.startsWith(year)).forEach(g => { map[g.date] = g; });
  return map;
}

function renderSummary(league, year) {
  const data = league === 'kbo' ? allGames : allFutures;
  const filtered = data.filter(g => g.date && g.date.startsWith(year));
  const wins  = filtered.filter(g => g.result === '승').length;
  const loses = filtered.filter(g => g.result === '패').length;
  const draws = filtered.filter(g => g.result === '무').length;
  const rate  = (wins + loses) > 0 ? (wins/(wins+loses)).toFixed(3) : '.000';
  document.getElementById(league+'-summary').innerHTML =
    '<div class="sum-box"><div class="sum-num" style="color:#27AE60">'+wins+'</div><div class="sum-label">승</div></div>' +
    '<div class="sum-box"><div class="sum-num" style="color:var(--red)">'+loses+'</div><div class="sum-label">패</div></div>' +
    '<div class="sum-box"><div class="sum-num" style="color:var(--gray)">'+draws+'</div><div class="sum-label">무</div></div>' +
    '<div class="sum-box"><div class="sum-num" style="color:var(--gold)">'+rate+'</div><div class="sum-label">승률</div></div>';
}

function renderCalendar(league) {
  const s = state[league];
  const { calYear, month, year } = s;
  const gameMap    = getGameMap(league === 'kbo' ? allGames : allFutures, year);
  const labelEl    = document.getElementById(league+'-month-label');
  const bodyEl     = document.getElementById(league+'-cal-body');
  const useLink    = league === 'kbo';

  labelEl.textContent = calYear + '년 ' + (month+1) + '월';

  const firstDay = new Date(calYear, month, 1).getDay();
  const lastDate = new Date(calYear, month+1, 0).getDate();
  const todayStr = String(today.getFullYear()) + String(today.getMonth()+1).padStart(2,'0') + String(today.getDate()).padStart(2,'0');

  let html = '';
  for (let i = 0; i < firstDay; i++) html += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= lastDate; d++) {
    const mm  = String(month+1).padStart(2,'0');
    const dd  = String(d).padStart(2,'0');
    const dateStr = String(calYear) + mm + dd;
    const dow = new Date(calYear, month, d).getDay();
    let cls = 'cal-cell';
    if (dateStr === todayStr) cls += ' today';
    if (dow === 0) cls += ' sunday';
    if (dow === 6) cls += ' saturday';
    html += '<div class="' + cls + '"><div class="cal-day">' + d + '</div>';
    const g = gameMap[dateStr];
    if (g) {
      const rc  = g.result === '승' ? 'win' : g.result === '패' ? 'lose' : 'draw';
      const opp = g.home_team === '두산' ? g.away_team : g.home_team;
      const tag = useLink ? 'a href="/game/'+g.game_id+'"' : 'div';
      const endTag = useLink ? 'a' : 'div';
      const stadium = g.stadium ? ' · '+g.stadium : '';
      html += '<'+tag+' class="cal-game '+rc+'"><div class="cal-game-score">'+g.home_score+' : '+g.away_score+'</div><div class="cal-game-team">vs '+opp+stadium+'</div></'+endTag+'>';
    }
    html += '</div>';
  }
  bodyEl.innerHTML = html;
}

function changeMonth(league, dir) {
  const s = state[league];
  s.month += dir;
  if (s.month > 11) { s.month = 0; s.calYear++; }
  if (s.month < 0)  { s.month = 11; s.calYear--; }
  renderCalendar(league);
}

function changeSeason(league, year) {
  state[league].year = year;
  state[league].calYear = parseInt(year);
  state[league].month = parseInt(year) === today.getFullYear() ? today.getMonth() : 2; // 3월부터
  renderSummary(league, year);
  renderCalendar(league);
}

function switchLeague(name, btn) {
  document.querySelectorAll('.league-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.league-tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
  // 드롭다운 교체
  document.getElementById('kbo-year-sel').style.display     = name === 'kbo' ? 'block' : 'none';
  document.getElementById('futures-year-sel').style.display = name === 'futures' ? 'block' : 'none';
}

// 초기화
renderSummary('kbo', CURRENT_YEAR);
renderSummary('futures', CURRENT_YEAR);
renderCalendar('kbo');
renderCalendar('futures');
</script>
{% endblock %}
