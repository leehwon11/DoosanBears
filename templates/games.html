{% extends "base.html" %}
{% block title %}경기 일정 · 두산 베어스{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <h1 class="page-title">경기 일정 · 결과</h1>
    <p class="page-sub">날짜를 눌러 KBO 경기 리포트를 확인하세요.</p>
  </div>
</div>

<div class="toolbar">
  <div class="seg" data-tabs="league" id="league-tabs">
    <button class="active" data-tab="kbo" aria-selected="true">KBO</button>
    <button data-tab="futures">퓨처스</button>
  </div>
  <div class="spacer"></div>
  <select class="select select-sm" id="kbo-year-sel" aria-label="KBO 시즌 선택">
    {% for yr in years %}<option value="{{ yr }}">{{ yr }} 시즌</option>{% endfor %}
  </select>
  <select class="select select-sm" id="futures-year-sel" aria-label="퓨처스 시즌 선택" hidden>
    {% for yr in fut_years %}<option value="{{ yr }}">{{ yr }} 시즌</option>{% endfor %}
  </select>
</div>

{% for lg in ['kbo', 'futures'] %}
<div class="tab-panel {% if loop.first %}active{% endif %}" id="league-{{ lg }}" data-tab-group="league">
  <div class="stat-grid section" id="{{ lg }}-summary" style="margin-bottom:22px"></div>
  <div class="month-nav">
    <button class="icon-btn" type="button" onclick="changeMonth('{{ lg }}',-1)" aria-label="이전 달">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="month-label num" id="{{ lg }}-month-label"></div>
    <button class="icon-btn" type="button" onclick="changeMonth('{{ lg }}',1)" aria-label="다음 달">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>
  <div class="calendar">
    <div class="cal-head"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="cal-body" id="{{ lg }}-cal-body"></div>
  </div>
</div>
{% endfor %}
{% endblock %}

{% block scripts %}
<script>
const DATA = { kbo: {{ games | tojson }}, futures: {{ futures_games | tojson }} };
const today = new Date();
const state = {};

// 시즌 기본값: 올해 기록이 있으면 올해, 없으면 가장 최근 시즌
function initState(league) {
  const sel = document.getElementById(league + '-year-sel');
  const years = Array.from(sel.options).map(o => o.value);
  const yr = years.includes(String(today.getFullYear())) ? String(today.getFullYear()) : (years[0] || String(today.getFullYear()));
  sel.value = yr;
  state[league] = { year: yr };
  setMonthForSeason(league, yr);
}

function setMonthForSeason(league, year) {
  const s = state[league];
  s.calYear = parseInt(year);
  if (s.calYear === today.getFullYear()) {
    s.month = today.getMonth();
    // 오늘이 속한 달에 경기가 없으면 해당 시즌 마지막 경기 달로
    const ym = year + String(s.month + 1).padStart(2, '0');
    if (!DATA[league].some(g => g.date && g.date.startsWith(ym))) {
      const last = DATA[league].find(g => g.date && g.date.startsWith(year));
      if (last) s.month = parseInt(last.date.slice(4, 6)) - 1;
    }
  } else {
    const last = DATA[league].find(g => g.date && g.date.startsWith(year)); // 최신순 정렬
    s.month = last ? parseInt(last.date.slice(4, 6)) - 1 : 2;
  }
}

function renderSummary(league) {
  const year = state[league].year;
  const games = DATA[league].filter(g => g.date && g.date.startsWith(year));
  const w = games.filter(g => g.result === '승').length;
  const l = games.filter(g => g.result === '패').length;
  const d = games.filter(g => g.result === '무').length;
  const pct = (w + l) ? (w / (w + l)).toFixed(3).replace(/^0/, '') : '.000';
  const tile = (label, val, cls) => '<div class="stat"><div class="stat-label">' + label + '</div><div class="stat-value ' + (cls || '') + '">' + val + '</div></div>';
  document.getElementById(league + '-summary').innerHTML =
    tile('경기', games.length) + tile('승', w, 'win') + tile('패', l, 'lose') + tile('무', d) + tile('승률', pct, 'gold');
}

function renderCalendar(league) {
  const { calYear, month } = state[league];
  const byDate = {};
  DATA[league].forEach(g => { (byDate[g.date] = byDate[g.date] || []).push(g); });
  Object.values(byDate).forEach(list => list.sort((a, b) => a.game_id.localeCompare(b.game_id))); // 더블헤더 순서

  document.getElementById(league + '-month-label').textContent = calYear + '년 ' + (month + 1) + '월';
  const firstDay = new Date(calYear, month, 1).getDay();
  const lastDate = new Date(calYear, month + 1, 0).getDate();
  const todayStr = '' + today.getFullYear() + String(today.getMonth() + 1).padStart(2, '0') + String(today.getDate()).padStart(2, '0');
  const link = league === 'kbo';

  let html = '';
  for (let i = 0; i < firstDay; i++) html += '<div class="cal-cell blank"></div>';
  for (let d = 1; d <= lastDate; d++) {
    const dateStr = '' + calYear + String(month + 1).padStart(2, '0') + String(d).padStart(2, '0');
    const dow = (firstDay + d - 1) % 7;
    let cls = 'cal-cell';
    if (dateStr === todayStr) cls += ' today';
    if (dow === 0) cls += ' sun';
    if (dow === 6) cls += ' sat';
    html += '<div class="' + cls + '"><div class="cal-day">' + d + '</div>';
    (byDate[dateStr] || []).forEach(g => {
      const home = g.home_team === '두산';
      const us = home ? g.home_score : g.away_score;
      const them = home ? g.away_score : g.home_score;
      const opp = home ? g.away_team : g.home_team;
      const inner = '<div class="s">' + esc(g.result || '') + ' ' + esc(us) + ':' + esc(them) + '</div>' +
                    '<div class="o">' + esc(opp) + (g.stadium ? '<span class="st"> · ' + esc(g.stadium) + '</span>' : '') + '</div>';
      html += link
        ? '<a class="cal-game ' + resultClass(g.result) + '" href="/game/' + encodeURIComponent(g.game_id) + '" title="두산 ' + esc(us) + ' : ' + esc(them) + ' ' + esc(opp) + '">' + inner + '</a>'
        : '<div class="cal-game ' + resultClass(g.result) + '">' + inner + '</div>';
    });
    html += '</div>';
  }
  const trailing = (7 - (firstDay + lastDate) % 7) % 7;
  for (let i = 0; i < trailing; i++) html += '<div class="cal-cell blank"></div>';
  document.getElementById(league + '-cal-body').innerHTML = html;
}

function changeMonth(league, dir) {
  const s = state[league];
  s.month += dir;
  if (s.month > 11) { s.month = 0; s.calYear++; }
  if (s.month < 0) { s.month = 11; s.calYear--; }
  renderCalendar(league);
}

['kbo', 'futures'].forEach(lg => {
  initState(lg);
  document.getElementById(lg + '-year-sel').addEventListener('change', e => {
    state[lg].year = e.target.value;
    setMonthForSeason(lg, e.target.value);
    renderSummary(lg);
    renderCalendar(lg);
  });
  renderSummary(lg);
  renderCalendar(lg);
});

document.getElementById('league-tabs').addEventListener('tabchange', e => {
  document.getElementById('kbo-year-sel').hidden = e.detail !== 'kbo';
  document.getElementById('futures-year-sel').hidden = e.detail !== 'futures';
});
</script>
{% endblock %}
