services:
  - type: web
    name: doosan-bears-stats
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300"
    envVars:
      - key: SUPABASE_PROJECT_ID
        sync: false
      - key: SUPABASE_POOLER_HOST
        value: aws-1-ap-northeast-2.pooler.supabase.com
      - key: SUPABASE_POOLER_PORT
        value: "5432"
      - key: DB_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_BASE_URL
        sync: false
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
