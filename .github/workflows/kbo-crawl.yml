name: 두산 베어스 자동 크롤링

on:
  schedule:
    - cron: "0,30 7-14 * * *"   # KBO 1군 경기 크롤링: KST 16:00~23:30, 30분 간격
    - cron: "15,45 7-14 * * *"  # 퓨처스 경기 크롤링: KST 16:15~23:45, 30분 간격
    - cron: "0 8 * * *"         # 선수 엔트리 업데이트: KST 17:00
  workflow_dispatch:
    inputs:
      job:
        description: "수동 실행할 작업"
        required: true
        default: crawl
        type: choice
        options:
          - crawl
          - futures
          - players
          - backfill
      start_date:
        description: "backfill 선택 시 시작일 (YYYYMMDD)"
        required: false
        default: "20260301"
      end_date:
        description: "backfill 선택 시 종료일 (YYYYMMDD, 비우면 오늘까지)"
        required: false
        default: ""

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 작업 실행
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_POOLER_HOST: aws-1-ap-northeast-2.pooler.supabase.com
          SUPABASE_POOLER_PORT: "5432"
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.job }}" in
              crawl)
                python -c "from scheduler import run_crawl_job; run_crawl_job()" ;;
              futures)
                python -c "from scheduler import run_futures_crawl_job; run_futures_crawl_job()" ;;
              players)
                python -c "from scheduler import update_players_job; update_players_job()" ;;
              backfill)
                END="${{ github.event.inputs.end_date }}"
                if [ -z "$END" ]; then END=$(date +%Y%m%d); fi
                python bulk_crawl.py "${{ github.event.inputs.start_date }}" "$END" ;;
            esac
          else
            case "${{ github.event.schedule }}" in
              "0,30 7-14 * * *")
                python -c "from scheduler import run_crawl_job; run_crawl_job()" ;;
              "15,45 7-14 * * *")
                python -c "from scheduler import run_futures_crawl_job; run_futures_crawl_job()" ;;
              "0 8 * * *")
                python -c "from scheduler import update_players_job; update_players_job()" ;;
            esac
          fi
